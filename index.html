<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <title>Expense Tracker</title>
  </head>

  <body>
    <div class="container">
      <!--Header-->
      <h1>Expense Tracker</h1>
      <!--Dashboard-->
      <div class="dashboard">
        <div class="card">
          <h3>Monthly Budget</h3>
          <p id="monthlyBudget">₹30,000</p>
        </div>

        <div class="card">
          <h3>Total Spent</h3>
          <p id="totalSpent">₹0</p>
        </div>

        <div class="card">
          <h3>Remaining</h3>
          <p id="remaining">₹30,000</p>
        </div>
      </div>

      <!--Monthly Budget-->

      <div class="budget-section">
        <label for="budget">Monthly Budget</label>

        <div class="budget-input">
          <input type="number" id="budget" placeholder="Enter monthly budget" />
          <button id="setBudget">Set Budget</button>
        </div>
      </div>

      <!--Add New Expense-->
      <div class="add-expense-section">
        <h2>Add New Expense</h2>

        <form id="expenseForm">
          <!--ExpenseName-->
          <div>
            <label for="expenseName">Expense Traker</label>
            <input
              type="text"
              id="expenseName"
              placeholder="Enter expense name"
              required
            />
          </div>
          <br />
          <!--Amount-->
          <div>
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              placeholder="Enter Amount"
              required
            />
          </div>
          <br />
          <!--Category-->
          <div>
            <label for="category">category</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <br />
          <!--Date-->
          <div>
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <br />
          <!--ExpenseType-->
          <div>
            <label for="expenseType">Expense Type</label>
            <select id="expenseType" required>
              <option value="">Select Type</option>
              <option value="Fixed Expense">Fixed Expense</option>
              <option value="Variable Expense">Variable Expense</option>
            </select>
          </div>
          <br />
          <!--Add Expense Button-->
          <div class="form-button">
            <button type="submit">Add Expense</button>
          </div>
        </form>
      </div>

      <!--Expense History-->
      <div class="expense-section">
        <div class="history-header">
          <h2>Expense History</h2>
          <input type="month" id="monthFilter" />
        </div>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Expense</th>
              <th>Category</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expenseList">
            <!-- Expenses will appear here -->
          </tbody>
        </table>
      </div>
    </div>
    <br />
    <script src="script.js"></script>
  </body>
</html>
